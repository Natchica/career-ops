# Career-Ops: Outbound text gate rules
# Source of truth for scanText() in unslop.mjs.
#
# Every text career-ops drafts for the candidate to send passes this catalogue
# before it is shown (modes/_writing.md, "Outbound text gate"). Rules 3 to 33 keep
# the numbers of cursor/plugins@unslop; rules 34 and up come from
# aboudjem/humanizer (pattern names in `source.rule`). theclaymethod/unslop
# supplies the repair contract and the fact check, not rules.
#
# The file owns the rule set, the severities and the "must not flag" contract.
# voice-dna.md section 1-2 win over every rule here: a rule that would flag what
# voice-dna.md prescribes (parentheses, a formal register, a direct question,
# "My CV is attached") says so in `must_not_flag`, and a test pins each case.
#
# Severity: `block` means unslop.mjs exits 2 and the draft is not shown as clean;
# `warn` is listed under Open items; `none` belongs to `detect: null` rules only.
#
# `detect` names a detector registered in unslop.mjs, dispatched by rule. A rule
# with `detect: null` is a reading check: scanText reports it under `skipped`,
# never as a pass, and modes/_writing.md carries it as a checklist line.
#
# Patterns are single-quoted YAML (a backslash is literal; a quote is written as
# two). Never use the word-boundary escape: under the `u` flag it treats accented
# letters as non-word. Boundaries are lookarounds on \p{L}. A test enforces both.
#
# See `cannot_catch` at the bottom before trusting a clean result.

rules:
  - id: '3'
    name: Superficial -ing tail
    source: { skill: cursor/plugins@unslop, rule: '3' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    patterns:
      en:
        - '(?<=,\s{1,3})(?:highlighting|underscoring|emphasi[sz]ing|showcasing|reflecting|fostering|ensuring|symboli[sz]ing|cementing|solidifying|signall?ing|contributing\s+to|paving\s+the\s+way)(?!\p{L})(?![^.!?;]*\p{N})[^.!?;]*'
      fr:
        - '(?<=,\s{1,3})(?:soulignant|mettant\s+en\s+(?:avant|lumière|valeur)|reflétant|témoignant|illustrant|favorisant|renforçant|démontrant|garantissant|contribuant\s+à)(?!\p{L})(?![^.!?;]*\p{N})[^.!?;]*'
    must_not_flag: >-
      A tail that carries a measured fact (a digit in the same clause), ordinary
      participles outside the closed list (building, logging, streaming), and
      French words that merely end in -ant (pendant, important, maintenant,
      permettant).

  - id: '5'
    name: Vague attribution
    source: { skill: cursor/plugins@unslop, rule: '5' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    terms:
      en:
        - experts believe
        - experts say
        - experts agree
        - studies show
        - studies suggest
        - research shows
        - research suggests
        - industry reports suggest
        - some critics argue
        - critics argue
        - it is widely believed
        - it is widely accepted
        - many believe
        - observers note
      fr:
        - selon les experts
        - les experts estiment
        - des études montrent
        - des études suggèrent
        - de nombreuses études
        - certains estiment
        - il est largement admis
    must_not_flag: A named source (a report, a paper, a person) stated with its name.

  - id: '7'
    name: "AI vocabulary, tier 1A"
    source: { skill: cursor/plugins@unslop, rule: '7' }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    skip_proper_nouns: true
    terms:
      en:
        - delve
        - delves
        - delved
        - delving
        - tapestry
        - tapestries
        - testament
        - multifaceted
        - realm
        - realms
        - interplay
    must_not_flag: >-
      A capitalised product or company name inside a sentence (MongoDB Realm). A
      sentence-initial capital is not provably a name, so it still fires.

  - id: '8'
    name: Fancy copula
    source: { skill: cursor/plugins@unslop, rule: '8' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    terms:
      en:
        - serves as
        - serve as
        - served as
        - stands as
        - stand as
        - boasts
        - boasting
        - marks a
        - represents a
        - holds the distinction of
    must_not_flag: Plain is and has; the noun features (the new features shipped).

  - id: '9'
    name: Negative parallelism
    source: { skill: cursor/plugins@unslop, rule: '9' }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    patterns:
      en:
        - '(?<!\p{L})not\s+(?:just|only|merely|simply)(?!\p{L})[^.!?;]{1,80}?(?<!\p{L})(?:but|rather)(?!\p{L})'
        - '(?<!\p{L})(?:it|this|that)(?:\s+is|[''’]s)\s+not\s+(?:just\s+|only\s+|merely\s+)?about(?!\p{L})[^.!?]{1,80}?[,;.]\s*(?:it|this|that)(?:\s+is|[''’]s)\s+about(?!\p{L})'
        - '(?<!\p{L})(?:is|are)(?:\s+not|n[''’]t)(?!\p{L})[^.!?\n]{1,60}[.!?]\s+(?:It|This|That|They)\s+(?:is|are)(?!\p{L})'
      fr:
        - '(?<!\p{L})(?:non|pas)\s+seulement(?!\p{L})[^.!?;]{1,80}?(?<!\p{L})mais(?!\p{L})'
        - '(?<!\p{L})ce\s+n[''’]est\s+pas(?!\p{L})[^.!?]{1,80}?[,;.]\s*c[''’]est(?!\p{L})'
    must_not_flag: >-
      A plain negation of a fact (I have not run production cloud
      infrastructure at scale), a not only with no but, and a French negation
      without a corrective clause. voice-dna.md section 3F calls this pattern
      fatal; the honest gap sentence stays allowed here and is handled by the
      letter contract.

  - id: '10'
    name: Rule of three
    source: { skill: cursor/plugins@unslop, rule: '10' }
    severity: none
    detect: null
    unimplemented_because: >-
      Three items in a row are often just three items. Telling a forced triad from
      a real one needs meaning, not a pattern. contacto Step 4 also prescribes a
      3-sentence frame, so the rule cannot be a scanner finding there.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: >-
      The contacto 3-sentence frame (Fit, Proof, CTA); a list of three real
      technologies or three real dates.

  - id: '11'
    name: Synonym cycling
    source: { skill: cursor/plugins@unslop, rule: '11' }
    severity: none
    detect: null
    unimplemented_because: >-
      Needs to know that two noun phrases name the same thing. A word list cannot.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: >-
      Two different things with similar names (the iExec middleware and the Nox
      protocol).

  - id: '12'
    name: False range
    source: { skill: cursor/plugins@unslop, rule: '12' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: [letter, email, message, answer, text]
    lang: [en]
    patterns:
      en:
        - '(?<!\p{L})from\s+(?:\p{L}+\s+)?(?:traditions?|innovations?|ideas?|visions?|execution|strateg(?:y|ies)|concepts?|reality|insights?|impact|possibilit(?:y|ies)|challenges?|opportunit(?:y|ies)|startups?|enterprises?|beginners?|experts?|individuals?|theory|practice|dreams?|chaos|clarity|complexity|simplicity)\s+to\s+(?:\p{L}+\s+)?(?:traditions?|innovations?|ideas?|visions?|execution|strateg(?:y|ies)|concepts?|reality|insights?|impact|possibilit(?:y|ies)|challenges?|opportunit(?:y|ies)|startups?|enterprises?|beginners?|experts?|individuals?|theory|practice|dreams?|chaos|clarity|complexity|simplicity)(?!\p{L})'
    must_not_flag: >-
      A range between real things on one scale (from design to production, from
      Java 11 to Java 17, from Jenkins to GitHub Actions). Off in kind cv.

  - id: '13'
    name: Em dash or en dash used as a dash
    source: { skill: cursor/plugins@unslop, rule: '13' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    patterns:
      all:
        - '—'
        - '(?<=\s)–(?=\s)'
        - '(?<=\s)--(?=\s)'
    must_not_flag: >-
      An unspaced range dash (250-350 words, 2024-2026, Basel-Zurich) and a
      hyphenated compound (end-to-end, EU-CH). voice-dna.md section 2 allows
      commas, colons, semicolons and parentheses in place of a dash, so
      parentheses are never a finding.

  - id: '14'
    name: Colon connector
    source: { skill: cursor/plugins@unslop, rule: '14' }
    severity: none
    detect: null
    unimplemented_because: >-
      A colon before a list or an example is fine and one before a reveal is not;
      the difference is the sentence after it, so no pattern separates them.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A colon before a list, an example, a time or a ratio.

  - id: '15'
    name: Boldface in prose
    source: { skill: cursor/plugins@unslop, rule: '15' }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, message, text]
    lang: all
    patterns:
      all:
        - '\*\*[^*\n]+\*\*'
        - '(?<![\p{L}\p{N}_])__[^_\n]+__(?![\p{L}\p{N}_])'
    must_not_flag: >-
      Bold in a form answer or a CV (kinds answer and cv are exempt); a single
      asterisk in a product such as 2*3. voice-dna.md section 2: a formal letter
      carries no bold text at all.

  - id: '16'
    name: Inline-header list
    source: { skill: cursor/plugins@unslop, rule: '16' }
    severity: none
    detect: null
    unimplemented_because: >-
      The tell is a bold label that restates the line after it. Spotting the
      restatement needs meaning.
    scope: text
    kinds: all
    lang: all
    must_not_flag: A label that names an item and is followed by new detail.

  - id: '17'
    name: Title-case heading
    source: { skill: cursor/plugins@unslop, rule: '17' }
    severity: none
    detect: null
    unimplemented_because: >-
      Proper nouns in a heading are capitalised legitimately; a title-case check
      cannot tell them from decoration without a name list.
    scope: text
    kinds: all
    lang: all
    must_not_flag: A heading with product or company names capitalised.

  - id: '18'
    name: Emoji
    source: { skill: cursor/plugins@unslop, rule: '18' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    patterns:
      all:
        - '(?![©®™←-⇿])\p{Extended_Pictographic}'
        - '[\u{1F1E6}-\u{1F1FF}]'
        - '⃣'
    must_not_flag: >-
      Copyright, registered and trademark signs, arrows (rule 33 owns those), and
      programming names such as C++ and C#.

  - id: '19'
    name: Curly quotes
    source: { skill: cursor/plugins@unslop, rule: '19' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: [en, fr]
    patterns:
      en:
        - '[‘’‚‛“”„‟]'
      fr:
        - '[‘‚‛“”„‟]'
        - '(?<!\p{L})’'
        - '’(?!\p{L})'
    must_not_flag: >-
      Straight quotes; French elision between letters (l'equipe typed with a curly
      apostrophe); French guillemets.

  - id: '20'
    name: Chatbot phrase
    source: { skill: cursor/plugins@unslop, rule: '20' }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    terms:
      en:
        - I hope this helps
        - I hope this message finds you well
        - I hope this email finds you well
        - I hope you are doing well
        - "I hope you're doing well"
        - let me know if
        - feel free to
        - happy to help
        - glad to help
        - "I'd be happy to help"
        - as an AI
        - as a language model
        - would you like me to
      fr:
        - "j'espère que cela vous aide"
        - "j'espère que cela vous aidera"
        - "j'espère que ce message vous trouve en bonne santé"
        - "j'espère que vous allez bien"
        - "en tant qu'IA"
        - en tant que modèle de langage
        - voulez-vous que je
    patterns:
      en:
        - '(?:^|(?<=[.!?]\s{1,3}))(?:Certainly|Of\s+course|Absolutely|Sure)(?=\s*[!,.])'
      fr:
        - '(?:^|(?<=[.!?]\s{1,3}))(?:Bien\s+sûr|Certainement|Absolument|Avec\s+plaisir)(?=\s*[!,.])'
    must_not_flag: >-
      A question put to the reader (Could you tell me which stack the team uses?),
      certainly or sure inside a sentence, and the ordinary French closings (Je
      reste a votre disposition; N'hesitez pas a me contacter).

  - id: '22'
    name: Sycophantic tone
    source: { skill: cursor/plugins@unslop, rule: '22' }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    terms:
      en:
        - great question
        - excellent question
        - "you're absolutely right"
        - you are absolutely right
        - what a great
        - brilliant idea
      fr:
        - excellente question
        - très bonne question
        - vous avez tout à fait raison
        - vous avez entièrement raison
        - quelle excellente idée
    must_not_flag: The word question on its own (a question about the stack).

  - id: '24'
    name: Stacked hedges
    source: { skill: cursor/plugins@unslop, rule: '24' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    patterns:
      en:
        - '(?<!\p{L})(?:could|might|may|would)\s+(?:potentially|possibly|perhaps|conceivably|arguably)(?!\p{L})'
        - '(?<!\p{L})(?:potentially|possibly|perhaps)\s+(?:could|might|may)(?!\p{L})'
    must_not_flag: A single modal verb (may improve latency).

  - id: '25'
    name: Generic conclusion
    source: { skill: cursor/plugins@unslop, rule: '25' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    terms:
      en:
        - the future looks bright
        - the future is bright
        - exciting times ahead
        - the possibilities are endless
        - only time will tell
        - a bright future
        - the journey continues
        - the sky is the limit
      fr:
        - "l'avenir s'annonce prometteur"
        - "l'avenir nous le dira"
        - les possibilités sont infinies
        - une aventure passionnante
        - de belles perspectives
    must_not_flag: A concrete plan or date (the future release adds batching).

  - id: '26'
    name: Abstract metaphor noun
    source: { skill: cursor/plugins@unslop, rule: '26' }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    skip_proper_nouns: true
    terms:
      en:
        - substrate
        - wedge
        - vector
        - locus
        - nexus
        - bedrock
        - endgame
        - north star
        - flywheel
        - scaffolding
        - paradigm
    except:
      - 'vector\s+(?:database|db|search|store|index|embeddings?|clock|register|graphics)'
      - '(?:simd|attack|feature|initiali[sz]ation|test)\s+vectors?'
      - '(?:programming|functional|reactive|actor|object-oriented)\s+paradigms?'
      - '(?:project|code|test)\s+scaffolding'
    must_not_flag: >-
      Literal technical collocations (vector database, SIMD vectors, functional
      paradigm, project scaffolding) and product names (Amazon Bedrock).

  - id: '27'
    name: Feeling over mechanism
    source: { skill: cursor/plugins@unslop, rule: '27' }
    severity: none
    detect: null
    unimplemented_because: >-
      A sentence that names a feeling instead of a mechanism or a number is a
      judgement about content.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A sentence that states a number, a name or a mechanism.

  - id: '28'
    name: Dense sentence
    source: { skill: cursor/plugins@unslop, rule: '28' }
    severity: none
    detect: null
    unimplemented_because: >-
      Sentence length alone is not a finding (voice-dna.md section 1-2 prefer
      complete sentences); whether a reader must backtrack is a reading check.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A long sentence that carries one idea.

  - id: '32'
    name: Mannered prose
    source: { skill: cursor/plugins@unslop, rule: '32' }
    severity: none
    detect: null
    unimplemented_because: >-
      Figurative phrasing where a literal one exists is a judgement; the
      metaphor nouns that can be listed are rule 26.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A literal technical term used literally.

  - id: '33'
    name: "Over-compression: arrows, w/"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, answer, text]
    lang: all
    patterns:
      all:
        - '[←-⇿⟰-⟿⤀-⥿]'
        - '(?<=\s)(?:->|=>|<-)(?=\s)'
        - '(?<![\p{L}\p{N}/])w\/o?(?=\s|\p{L})'
    must_not_flag: >-
      Arrows in a CV or a message (kinds cv and message are exempt: a CV bullet
      and a chat message are compressed by nature); w/ inside a URL path.

  - id: '33b'
    name: "Over-compression: ampersand in prose"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: warn
    detect: match-list
    scope: text
    kinds: [letter, email, answer, text]
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '(?<=\p{Ll})\s&\s(?=\p{Ll})'
    must_not_flag: >-
      Company and product names (R&D, AT&T, Procter & Gamble).

  - id: '33c'
    name: "Over-compression: verbless fragment"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: none
    detect: null
    unimplemented_because: >-
      A fragment without a verb cannot be told from a heading or a signature
      line by a pattern.
    scope: prose
    kinds: [letter, email, answer, text]
    lang: all
    must_not_flag: A signature, a heading or a contact line.

  - id: '34'
    name: Markdown bleeding
    source: { skill: aboudjem/humanizer, rule: P28 Markdown bleeding }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, message, text]
    lang: all
    patterns:
      all:
        - '^[ \t]{0,3}#{1,6}[ \t]+\S'
        - '^[ \t]{0,3}(?:[-*+]|\d{1,2}[.)])[ \t]+\S'
        - '\[[^\]\n]+\]\((?:https?:\/\/|www\.|\/)[^)\s]*\)'
        - '`[^`\n]+`'
        - '^[ \t]{0,3}>[ \t]'
        - '^[ \t]*\|.*\|[ \t]*$'
    must_not_flag: >-
      Bullets in a form answer or a CV (voice-dna.md section 2 allows them there;
      kinds answer and cv are exempt), a phone line starting with a plus sign,
      C# and F#, a version number such as 9.0.0.

  - id: '35'
    name: Placeholder
    source: { skill: aboudjem/humanizer, rule: P33 Placeholder text }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '\[(?![Cc]onfirm(?!\p{L}))[^\]\n]{1,60}\](?!\()'
        - '\{\{?[\p{L}_][\p{L}\p{N}_ .-]{0,40}\}\}?'
        - '(?<![\p{L}\p{N}])X{2,}(?![\p{L}\p{N}])'
        - '(?<!\p{L})(?:TBD|TODO|FIXME|[Ll]orem\s+ipsum)(?!\p{L})'
    must_not_flag: >-
      The [confirm ...] marker, which is the Open items convention and stays a
      verify-letter warning (the agent cannot resolve it); parentheses; XXL and
      roman-numeral centuries such as XXe.

  - id: '36'
    name: Hook line
    source: { skill: aboudjem/humanizer, rule: P41 Infomercial engagement hooks }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    patterns:
      en:
        - '(?:^|(?<=[.!?]\s{1,3}))(?:The\s+(?:catch|kicker|twist|best\s+part|bottom\s+line)\?|Here(?:[''’]s|\s+is)\s+the\s+thing[.:]|Sound\s+familiar\?|Let\s+that\s+sink\s+in[.!]|Read\s+that\s+again[.!]|Plot\s+twist[:.!]|Full\s+stop[.!])'
    must_not_flag: A sentence that uses the word catch or twist as a plain noun (The catch rate rose).

  - id: '37'
    name: Hedged-enumeration opener
    source: { skill: aboudjem/humanizer, rule: P53 Hedged-enumeration openers }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    terms:
      en:
        - there are several ways to
        - there are a few things to consider
        - there are many factors
        - there are several reasons
        - here are a few
        - here are some
    must_not_flag: A counted statement (There are 3 services in the stack).

  - id: '38'
    name: Argument residue
    source: { skill: aboudjem/humanizer, rule: P54 Argument residue }
    severity: warn
    detect: match-list
    scope: prose
    kinds: all
    lang: [en]
    terms:
      en:
        - while some might argue
        - some might argue
        - it would be easy to dismiss
        - one might think
        - it could be argued
        - critics may say
        - at first glance
    must_not_flag: A rebuttal of an objection the text itself raised earlier; a first glance (no "at").

  - id: '39'
    name: Meta commentary
    source: { skill: aboudjem/humanizer, rule: Meta commentary }
    severity: block
    detect: match-list
    scope: prose
    kinds: all
    lang: [en, fr]
    terms:
      en:
        - in this article
        - in this post
        - in this essay
        - in this section
        - let me walk you through
        - "let's dive in"
        - let us dive in
        - "let's explore"
        - "let's unpack"
        - "here's a comprehensive overview"
        - here is a comprehensive overview
        - without further ado
        - allow me to introduce myself
      fr:
        - dans cet article
        - dans ce billet
        - dans cette section
        - permettez-moi de vous présenter
        - laissez-moi vous expliquer
        - sans plus attendre
        - plongeons dans
    must_not_flag: In this role (a role description is content, not commentary about the text).

  - id: '40'
    name: Unicode obfuscation
    source: { skill: aboudjem/humanizer, rule: Unicode obfuscation }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '[​-‏‪-‮⁠-⁤⁦-⁩﻿­]'
        - '(?<!\p{L})(?=\p{L}*\p{Script=Latin})(?=\p{L}*[аеорсухіјѕԁһԛԝАВЕКМНОРСТХІЈЅαεικνορτυχΑΒΕΗΙΚΜΝΟΡΤΥΧΖ])\p{L}+'
    must_not_flag: >-
      A space before a percent sign, narrow-space thousands separators, Greek
      unit symbols (mu s), accented Latin letters (Zurich with an umlaut).

cannot_catch:
  - id: meaning
    summary: A repair can keep every number and still change a claim. The scanner checks wording and facts, not meaning; the repair contract and the reading checklist cover it.
  - id: tone
    summary: Whether a sentence sounds like the candidate is a reading judgement. voice-dna.md section 1-2 set the register; the scanner never scores tone.
  - id: rhythm
    summary: Uniform sentence length is never a finding. voice-dna.md section 1 asks for complete, plain sentences, and a formal or non-native register is an honest voice, not a tell.
  - id: drafting-facts
    summary: Whether a fact in the draft is true is verify-cv-facts.mjs and the Source-of-Truth boundary, not this scanner.
  - id: other-languages
    summary: Only English and French are scanned. Another output language gets "Outbound text gate not run" under Open items.
