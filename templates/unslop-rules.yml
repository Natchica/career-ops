# Career-Ops: Outbound text gate rules
# Source of truth for scanText() in unslop.mjs.
#
# Every text career-ops drafts for the candidate to send passes this catalogue
# before it is shown (modes/_writing.md, "Outbound text gate"). Rules 3 to 33 keep
# the numbers of cursor/plugins@unslop; rules 34 and up come from
# aboudjem/humanizer (pattern names in `source.rule`). theclaymethod/unslop
# supplies the repair contract and the fact check, not rules.
#
# The file owns the rule set, the severities and the "must not flag" contract.
# voice-dna.md section 1-2 win over every rule here: a rule that would flag what
# voice-dna.md prescribes (parentheses, a formal register, a direct question,
# "My CV is attached") says so in `must_not_flag`, and a test pins each case.
#
# Severity: `block` means unslop.mjs exits 2 and the draft is not shown as clean;
# `warn` is listed under Open items; `none` belongs to `detect: null` rules only.
#
# `detect` names a detector registered in unslop.mjs, dispatched by rule. A rule
# with `detect: null` is a reading check: scanText reports it under `skipped`,
# never as a pass, and modes/_writing.md carries it as a checklist line.
#
# Patterns are single-quoted YAML (a backslash is literal; a quote is written as
# two). Never use the word-boundary escape: under the `u` flag it treats accented
# letters as non-word. Boundaries are lookarounds on \p{L}. A test enforces both.
#
# See `cannot_catch` at the bottom before trusting a clean result.

rules:
  - id: '10'
    name: Rule of three
    source: { skill: cursor/plugins@unslop, rule: '10' }
    severity: none
    detect: null
    unimplemented_because: >-
      Three items in a row are often just three items. Telling a forced triad from
      a real one needs meaning, not a pattern. contacto Step 4 also prescribes a
      3-sentence frame, so the rule cannot be a scanner finding there.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: >-
      The contacto 3-sentence frame (Fit, Proof, CTA); a list of three real
      technologies or three real dates.

  - id: '11'
    name: Synonym cycling
    source: { skill: cursor/plugins@unslop, rule: '11' }
    severity: none
    detect: null
    unimplemented_because: >-
      Needs to know that two noun phrases name the same thing. A word list cannot.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: >-
      Two different things with similar names (the iExec middleware and the Nox
      protocol).

  - id: '13'
    name: Em dash or en dash used as a dash
    source: { skill: cursor/plugins@unslop, rule: '13' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    patterns:
      all:
        - '—'
        - '(?<=\s)–(?=\s)'
        - '(?<=\s)--(?=\s)'
    must_not_flag: >-
      An unspaced range dash (250-350 words, 2024-2026, Basel-Zurich) and a
      hyphenated compound (end-to-end, EU-CH). voice-dna.md section 2 allows
      commas, colons, semicolons and parentheses in place of a dash, so
      parentheses are never a finding.

  - id: '14'
    name: Colon connector
    source: { skill: cursor/plugins@unslop, rule: '14' }
    severity: none
    detect: null
    unimplemented_because: >-
      A colon before a list or an example is fine and one before a reveal is not;
      the difference is the sentence after it, so no pattern separates them.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A colon before a list, an example, a time or a ratio.

  - id: '15'
    name: Boldface in prose
    source: { skill: cursor/plugins@unslop, rule: '15' }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, message, text]
    lang: all
    patterns:
      all:
        - '\*\*[^*\n]+\*\*'
        - '(?<![\p{L}\p{N}_])__[^_\n]+__(?![\p{L}\p{N}_])'
    must_not_flag: >-
      Bold in a form answer or a CV (kinds answer and cv are exempt); a single
      asterisk in a product such as 2*3. voice-dna.md section 2: a formal letter
      carries no bold text at all.

  - id: '16'
    name: Inline-header list
    source: { skill: cursor/plugins@unslop, rule: '16' }
    severity: none
    detect: null
    unimplemented_because: >-
      The tell is a bold label that restates the line after it. Spotting the
      restatement needs meaning.
    scope: text
    kinds: all
    lang: all
    must_not_flag: A label that names an item and is followed by new detail.

  - id: '17'
    name: Title-case heading
    source: { skill: cursor/plugins@unslop, rule: '17' }
    severity: none
    detect: null
    unimplemented_because: >-
      Proper nouns in a heading are capitalised legitimately; a title-case check
      cannot tell them from decoration without a name list.
    scope: text
    kinds: all
    lang: all
    must_not_flag: A heading with product or company names capitalised.

  - id: '18'
    name: Emoji
    source: { skill: cursor/plugins@unslop, rule: '18' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    patterns:
      all:
        - '(?![©®™←-⇿])\p{Extended_Pictographic}'
        - '[\u{1F1E6}-\u{1F1FF}]'
        - '⃣'
    must_not_flag: >-
      Copyright, registered and trademark signs, arrows (rule 33 owns those), and
      programming names such as C++ and C#.

  - id: '19'
    name: Curly quotes
    source: { skill: cursor/plugins@unslop, rule: '19' }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: [en, fr]
    patterns:
      en:
        - '[‘’‚‛“”„‟]'
      fr:
        - '[‘‚‛“”„‟]'
        - '(?<!\p{L})’'
        - '’(?!\p{L})'
    must_not_flag: >-
      Straight quotes; French elision between letters (l'equipe typed with a curly
      apostrophe); French guillemets.

  - id: '27'
    name: Feeling over mechanism
    source: { skill: cursor/plugins@unslop, rule: '27' }
    severity: none
    detect: null
    unimplemented_because: >-
      A sentence that names a feeling instead of a mechanism or a number is a
      judgement about content.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A sentence that states a number, a name or a mechanism.

  - id: '28'
    name: Dense sentence
    source: { skill: cursor/plugins@unslop, rule: '28' }
    severity: none
    detect: null
    unimplemented_because: >-
      Sentence length alone is not a finding (voice-dna.md section 1-2 prefer
      complete sentences); whether a reader must backtrack is a reading check.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A long sentence that carries one idea.

  - id: '32'
    name: Mannered prose
    source: { skill: cursor/plugins@unslop, rule: '32' }
    severity: none
    detect: null
    unimplemented_because: >-
      Figurative phrasing where a literal one exists is a judgement; the
      metaphor nouns that can be listed are rule 26.
    scope: prose
    kinds: all
    lang: all
    must_not_flag: A literal technical term used literally.

  - id: '33'
    name: "Over-compression: arrows, w/"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, answer, text]
    lang: all
    patterns:
      all:
        - '[←-⇿⟰-⟿⤀-⥿]'
        - '(?<=\s)(?:->|=>|<-)(?=\s)'
        - '(?<![\p{L}\p{N}/])w\/o?(?=\s|\p{L})'
    must_not_flag: >-
      Arrows in a CV or a message (kinds cv and message are exempt: a CV bullet
      and a chat message are compressed by nature); w/ inside a URL path.

  - id: '33b'
    name: "Over-compression: ampersand in prose"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: warn
    detect: match-list
    scope: text
    kinds: [letter, email, answer, text]
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '(?<=\p{Ll})\s&\s(?=\p{Ll})'
    must_not_flag: >-
      Company and product names (R&D, AT&T, Procter & Gamble).

  - id: '33c'
    name: "Over-compression: verbless fragment"
    source: { skill: cursor/plugins@unslop, rule: '33' }
    severity: none
    detect: null
    unimplemented_because: >-
      A fragment without a verb cannot be told from a heading or a signature
      line by a pattern.
    scope: prose
    kinds: [letter, email, answer, text]
    lang: all
    must_not_flag: A signature, a heading or a contact line.

  - id: '34'
    name: Markdown bleeding
    source: { skill: aboudjem/humanizer, rule: P28 Markdown bleeding }
    severity: block
    detect: match-list
    scope: text
    kinds: [letter, email, message, text]
    lang: all
    patterns:
      all:
        - '^[ \t]{0,3}#{1,6}[ \t]+\S'
        - '^[ \t]{0,3}(?:[-*+]|\d{1,2}[.)])[ \t]+\S'
        - '\[[^\]\n]+\]\((?:https?:\/\/|www\.|\/)[^)\s]*\)'
        - '`[^`\n]+`'
        - '^[ \t]{0,3}>[ \t]'
        - '^[ \t]*\|.*\|[ \t]*$'
    must_not_flag: >-
      Bullets in a form answer or a CV (voice-dna.md section 2 allows them there;
      kinds answer and cv are exempt), a phone line starting with a plus sign,
      C# and F#, a version number such as 9.0.0.

  - id: '35'
    name: Placeholder
    source: { skill: aboudjem/humanizer, rule: P33 Placeholder text }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '\[(?![Cc]onfirm(?!\p{L}))[^\]\n]{1,60}\](?!\()'
        - '\{\{?[\p{L}_][\p{L}\p{N}_ .-]{0,40}\}\}?'
        - '(?<![\p{L}\p{N}])X{2,}(?![\p{L}\p{N}])'
        - '(?<!\p{L})(?:TBD|TODO|FIXME|[Ll]orem\s+ipsum)(?!\p{L})'
    must_not_flag: >-
      The [confirm ...] marker, which is the Open items convention and stays a
      verify-letter warning (the agent cannot resolve it); parentheses; XXL and
      roman-numeral centuries such as XXe.

  - id: '40'
    name: Unicode obfuscation
    source: { skill: aboudjem/humanizer, rule: Unicode obfuscation }
    severity: block
    detect: match-list
    scope: text
    kinds: all
    lang: all
    case_sensitive: true
    patterns:
      all:
        - '[​-‏‪-‮⁠-⁤⁦-⁩﻿­]'
        - '(?<!\p{L})(?=\p{L}*\p{Script=Latin})(?=\p{L}*[аеорсухіјѕԁһԛԝАВЕКМНОРСТХІЈЅαεικνορτυχΑΒΕΗΙΚΜΝΟΡΤΥΧΖ])\p{L}+'
    must_not_flag: >-
      A space before a percent sign, narrow-space thousands separators, Greek
      unit symbols (mu s), accented Latin letters (Zurich with an umlaut).

cannot_catch:
  - id: meaning
    summary: A repair can keep every number and still change a claim. The scanner checks wording and facts, not meaning; the repair contract and the reading checklist cover it.
  - id: tone
    summary: Whether a sentence sounds like the candidate is a reading judgement. voice-dna.md section 1-2 set the register; the scanner never scores tone.
  - id: rhythm
    summary: Uniform sentence length is never a finding. voice-dna.md section 1 asks for complete, plain sentences, and a formal or non-native register is an honest voice, not a tell.
  - id: drafting-facts
    summary: Whether a fact in the draft is true is verify-cv-facts.mjs and the Source-of-Truth boundary, not this scanner.
  - id: other-languages
    summary: Only English and French are scanned. Another output language gets "Outbound text gate not run" under Open items.
