# Radar commute-zone table. Maps places and postcodes to the zones A-D of
# modes/_brief.md (anchor: Colmar). Zone E and remote are out of the radar.
#
# Override: copy this file to {DATA_ROOT}/config/radar-zones.yml. A missing
# override falls back to this file; a present but unparseable override is an error.
#
# Entry fields:
#   zone      A | B | C | D, or null for a place that only disambiguates a name
#   country   CH | FR | DE
#   name      display and match name (case and accent insensitive)
#   postcodes list of codes or "from-to" ranges (CH 4 digits, FR and DE 5 digits)
#   aliases   other spellings
#   default   true: wins when a name is shared and no country hint is given
#
# Agglomeration postcodes take the zone of their core town.
